name: Publish ontology and educational catalogue

# Publishing is deliberate: ordinary development commits do not change the site.
on:
  workflow_dispatch:
    inputs:
      initial_publication:
        description: Create the publication branch (first deployment only)
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: icareonto-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate the release package
        run: python scripts/run_checks.py
      - name: Check publication and archive behaviour
        run: python -m unittest discover -s scripts/tests -v
      - name: Check conversational-agent export and protected refresh
        run: python -m unittest discover -s integrations/conversational-agent/tests -v
      - name: Match a GitHub release tag to the ontology version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from build_publication import ROOT, ontology_payloads, require
          version, _ = ontology_payloads(ROOT)
          tag = os.environ.get('RELEASE_TAG')
          require(not tag or tag == 'v' + version, 'GitHub release tag must match ontology version')
          PY
      - name: Load the preserved publication branch
        shell: bash
        env:
          ALLOW_FIRST_PUBLICATION: ${{ inputs.initial_publication || false }}
        run: |
          set -euo pipefail
          mkdir -p build
          if git ls-remote --exit-code --heads origin refs/heads/gh-pages > build/previous-ref; then
            git fetch origin refs/heads/gh-pages
            git worktree add --detach build/published FETCH_HEAD
            echo 'HAS_PREVIOUS_SITE=true' >> "$GITHUB_ENV"
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            if [ "$ALLOW_FIRST_PUBLICATION" != true ]; then
              echo 'gh-pages is missing. Use initial_publication only for the first deployment; otherwise restore the publication branch.' >&2
              exit 1
            fi
            git worktree add --detach build/published HEAD
            git -C build/published switch --orphan pages-initial
            echo 'HAS_PREVIOUS_SITE=false' >> "$GITHUB_ENV"
          fi
      - name: Build the distribution
        shell: bash
        run: |
          set -euo pipefail
          previous=()
          if [ "$HAS_PREVIOUS_SITE" = true ]; then previous=(--previous build/published); fi
          python scripts/build_publication.py --output build/site "${previous[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Retain the verified distribution and release history
        run: |
          rsync -a --delete --exclude=.git build/site/ build/published/
          git -C build/published add --all
          if ! git -C build/published diff --cached --quiet; then
            git -C build/published -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish iCARE Onto and educational catalogue'
            publication_commit=$(git -C build/published rev-parse HEAD)
            git push origin "$publication_commit:refs/heads/gh-pages"
          fi
      - name: Upload the verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install RDF validation dependency
        run: python -m pip install -r serialisation/scripts/requirements.txt
      - name: Verify live media types and import closure
        env:
          PUBLICATION_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/check_publication_site.py --base-url "$PUBLICATION_URL"
